<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сестринское дело — Билеты 2 курс с ответами</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f7;--bg3:#efefef;
  --text:#1a1a1a;--text2:#444;--text3:#888;
  --border:#e0e0e0;--border2:#bbb;
  --blue:#1565C0;--blue-bg:#E3F0FF;
  --green:#0F6E56;--green-bg:#E1F5EE;
  --orange:#9E5B00;--orange-bg:#FFF3E0;
  --red:#993C1D;--red-bg:#FAECE7;
  --purple:#5B3DB8;--purple-bg:#EDE7FF;
  --radius:10px;--radius-sm:7px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#181818;--bg2:#222;--bg3:#2a2a2a;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#333;--border2:#555;
  --blue:#90CAF9;--blue-bg:#0D2A4A;--green:#5DCAA5;--green-bg:#0a2e24;
  --orange:#FFB74D;--orange-bg:#2A1A00;--red:#F09595;--red-bg:#2e0d0d;--purple:#B39DDB;--purple-bg:#1A1040;}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
.app{max-width:860px;margin:0 auto;padding:1.2rem}

/* HEADER */
.header{text-align:center;padding:2rem 1rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.header h1{font-size:24px;font-weight:700;margin-bottom:6px}
.header p{color:var(--text2);font-size:14px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}

/* SEARCH & FILTER */
.toolbar{display:flex;gap:10px;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:12px;color:var(--text2);transition:all .15s;font-weight:500}
.fb:hover,.fb.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.results-count{font-size:13px;color:var(--text3);white-space:nowrap}

/* TICKET */
.ticket{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden;transition:box-shadow .15s}
.ticket:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ticket-header{display:flex;align-items:center;gap:10px;padding:.9rem 1.1rem;cursor:pointer;background:var(--bg2);transition:background .15s;user-select:none}
.ticket-header:hover{background:var(--bg3)}
.ticket-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0}
.ticket-title{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.ticket-arrow{color:var(--text3);font-size:18px;transition:transform .2s}
.ticket-arrow.open{transform:rotate(90deg)}
.ticket-body{display:none;padding:0}
.ticket-body.open{display:block}

/* QUESTION BLOCK */
.qblock{border-top:1px solid var(--border);padding:1.1rem 1.2rem}
.qblock:first-child{border-top:none}
.q-label{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.q-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0}
.q-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px}
.q-text{font-size:15px;font-weight:600;color:var(--text);margin-bottom:.8rem;line-height:1.5}
.answer{background:var(--bg2);border-radius:var(--radius-sm);padding:1rem 1.1rem;border-left:3px solid var(--green)}
.answer p{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:.6rem}
.answer p:last-child{margin-bottom:0}
.answer ul,.answer ol{margin:.4rem 0 .4rem 1.2rem}
.answer li{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:.2rem}
.answer strong{color:var(--text);font-weight:600}
.answer .warning{background:var(--red-bg);border-left:3px solid var(--red);border-radius:var(--radius-sm);padding:.5rem .8rem;margin-top:.6rem;font-size:13px;color:var(--red)}
.answer .tip{background:var(--orange-bg);border-left:3px solid var(--orange);border-radius:var(--radius-sm);padding:.5rem .8rem;margin-top:.6rem;font-size:13px;color:var(--orange)}
.answer .algo{background:var(--blue-bg);border-radius:var(--radius-sm);padding:.6rem .8rem;margin-top:.5rem}
.answer .algo-title{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.answer .algo ol{margin-left:1rem}
.answer .algo li{font-size:13px;color:var(--text2);line-height:1.6}
.answer h4{font-size:13px;font-weight:700;color:var(--text);margin:.6rem 0 .3rem}

/* COLORS */
.c-blue{background:#1565C0}.c-green{background:#1B7A45}.c-orange{background:#E65100}
.c-purple{background:#5B3DB8}.c-red{background:#A32D2D}.c-teal{background:#006064}
.c-brown{background:#5D4037}
.t-theory{background:var(--blue-bg);color:var(--blue)}
.t-skill{background:var(--green-bg);color:var(--green)}
.t-case{background:var(--orange-bg);color:var(--orange)}

/* NO RESULTS */
.no-results{text-align:center;padding:3rem;color:var(--text3);font-size:15px}

/* PROGRESS */
.progress-bar-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:1rem}
.progress-info{flex:1}
.progress-info h3{font-size:14px;font-weight:600;margin-bottom:4px}
.progress-info p{font-size:12px;color:var(--text3)}
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.pbar-fill{height:100%;background:#1B7A45;border-radius:3px;transition:width .5s}
.expand-all-btn{padding:7px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);white-space:nowrap;transition:all .15s}
.expand-all-btn:hover{background:var(--bg2)}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1>📋 Сестринское дело — 2 курс</h1>
  <p>Экзаменационные билеты с подробными ответами</p>
  <div class="badges">
    <span class="badge" style="background:var(--blue-bg);color:var(--blue)">📚 35 билетов</span>
    <span class="badge" style="background:var(--green-bg);color:var(--green)">✅ Теория</span>
    <span class="badge" style="background:var(--green-bg);color:var(--green)">🩺 Навыки</span>
    <span class="badge" style="background:var(--orange-bg);color:var(--orange)">🏥 Клинические задачи</span>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Поиск по теме или вопросу..." oninput="filterTickets()">
  </div>
  <div class="filter-btns">
    <button class="fb active" onclick="filterByType('all',this)">Все</button>
    <button class="fb" onclick="filterByType('emergency',this)">Неотложная помощь</button>
    <button class="fb" onclick="filterByType('injection',this)">Инъекции</button>
    <button class="fb" onclick="filterByType('hygiene',this)">Гигиена/Уход</button>
    <button class="fb" onclick="filterByType('org',this)">Организация</button>
  </div>
  <span class="results-count" id="results-count">35 билетов</span>
</div>

<div class="progress-bar-wrap">
  <div class="progress-info">
    <h3>Прогресс изучения</h3>
    <p id="prog-text">Откройте билеты для отслеживания</p>
    <div class="pbar"><div class="pbar-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <button class="expand-all-btn" id="expand-btn" onclick="toggleAll()">Развернуть все</button>
</div>

<div id="tickets-container"></div>
<div class="no-results" id="no-results" style="display:none">🔍 Ничего не найдено</div>

</div>

<script>
const TICKETS = [
{n:1, tags:['hygiene','org'],
qs:[
{type:'theory', q:'Современные методы ухода за больным в стационарных условиях',
a:`<p><strong>Сестринский уход</strong> — комплекс мероприятий, направленных на поддержание и восстановление здоровья пациента.</p>
<h4>Основные направления:</h4>
<ul>
<li><strong>Личная гигиена:</strong> умывание, обтирание, уход за полостью рта, волосами, ногтями; при необходимости — гигиенические ванны</li>
<li><strong>Профилактика пролежней:</strong> смена положения тела каждые 2 часа, противопролежневые матрасы, массаж кожи</li>
<li><strong>Питание:</strong> кормление тяжёлых больных, контроль диеты, расчёт водного баланса</li>
<li><strong>Двигательная активность:</strong> пассивная/активная гимнастика, ЛФК</li>
<li><strong>Психологическая поддержка:</strong> общение, снижение тревоги, обучение пациента и родственников</li>
<li><strong>Контроль жизненных показателей:</strong> АД, пульс, ЧДД, температура, диурез</li>
<li><strong>Выполнение назначений врача:</strong> введение лекарств, перевязки, процедуры</li>
</ul>
<p><strong>Современные подходы:</strong> использование функциональных кроватей, противопролежневых систем, инфузоматов, пульсоксиметрии, мониторинга ЭКГ.</p>`},
{type:'skill', q:'Измерение артериального пульса и артериального давления и запись в температурный лист',
a:`<h4>Измерение пульса:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Положить руку пациента в удобное положение</li>
<li>Прижать 2–4 пальцами лучевую артерию у основания большого пальца</li>
<li>Считать удары в течение 1 минуты (при нарушениях) или 30 сек × 2</li>
<li>Оценить: частоту (норма 60–80/мин), ритм, наполнение, напряжение</li>
<li>Записать в температурный лист красным цветом</li>
</ol></div>
<h4>Измерение АД (тонометром):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Пациент сидит или лежит, рука на уровне сердца, ладонью вверх, расслаблена</li>
<li>Наложить манжету на 2–3 см выше локтевого сгиба</li>
<li>Нащупать пульс в локтевой ямке, поставить фонендоскоп</li>
<li>Нагнать воздух до 180–200 мм рт. ст., медленно выпускать</li>
<li>1-й тон Короткова = систолическое, исчезновение тонов = диастолическое</li>
<li>Норма: 110/70 – 139/89 мм рт. ст.</li>
<li>Записать в температурный лист синим цветом (дробью)</li>
</ol></div>
<div class="tip">Измерять дважды с интервалом 3 мин, фиксировать среднее значение</div>`},
{type:'skill', q:'Профилактика и уход за пролежнями',
a:`<h4>Профилактика:</h4>
<ul>
<li>Менять положение тела каждые <strong>2 часа</strong></li>
<li>Использовать <strong>противопролежневые матрасы</strong> (водяные, воздушные, поролоновые)</li>
<li>Кожу ежедневно осматривать, протирать камфорным спиртом или специальными средствами</li>
<li>Постельное бельё без складок, сухое, чистое</li>
<li>Рациональное питание: белок, витамины</li>
<li>Валики под костные выступы</li>
</ul>
<h4>Стадии пролежней и уход:</h4>
<ul>
<li><strong>I (покраснение):</strong> обработка камфорным спиртом, сухое тепло</li>
<li><strong>II (пузырь/поверхностный дефект):</strong> вскрыть пузырь, асептическая повязка, солкосерил</li>
<li><strong>III (некроз до фасции):</strong> некрэктомия, промывание, антисептические повязки</li>
<li><strong>IV (до кости/мышц):</strong> хирургическое лечение, системные антибиотики</li>
</ul>
<div class="warning">Зоны риска: крестец, пятки, лопатки, локти, затылок</div>`}
]},

{n:2, tags:['hygiene','skill'],
qs:[
{type:'theory', q:'Понятие об остром абдоминальном синдроме, клинические симптомы и обязанности медсестры при оказании неотложной помощи',
a:`<p><strong>Острый абдоминальный синдром (ОАС)</strong> — комплекс симптомов, возникающих при острых заболеваниях органов брюшной полости, требующих немедленной медицинской помощи.</p>
<h4>Причины:</h4>
<ul><li>Острый аппендицит, перитонит, кишечная непроходимость</li>
<li>Перфорация язвы желудка, разрыв селезёнки</li>
<li>Острый панкреатит, холецистит</li></ul>
<h4>Клинические симптомы:</h4>
<ul>
<li><strong>Боль в животе</strong> — острая, внезапная, может быть разлитой</li>
<li><strong>Напряжение мышц живота</strong> — «доскообразный» живот</li>
<li><strong>Симптом Щёткина–Блюмберга</strong> — боль при отпускании руки</li>
<li>Тошнота, рвота, задержка газов, стула</li>
<li>Тахикардия, падение АД, бледность, потливость</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Немедленно вызвать врача</li>
<li>Уложить пациента, запретить есть, пить, ставить клизмы</li>
<li><strong>НЕ</strong> вводить обезболивающие до осмотра хирурга</li>
<li>Контролировать АД, пульс, ЧДД каждые 15 мин</li>
<li>Установить в/в катетер, готовить к экстренной операции</li>
<li>Успокоить пациента, не оставлять одного</li>
</ol></div>
<div class="warning">ЗАПРЕЩЕНО: тепло на живот, слабительные, обезболивающие без разрешения хирурга</div>`},
{type:'skill', q:'Кормление больных через зонд и гастростому',
a:`<h4>Через назогастральный зонд:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Надеть перчатки, обработать руки антисептиком</li>
<li>Убедиться в правильном положении зонда (ввести воздух шприцем и аускультировать желудок)</li>
<li>Приготовить питательную смесь температурой <strong>37–38°C</strong></li>
<li>Подсоединить шприц Жане (60 мл) или систему</li>
<li>Ввести медленно, 200–300 мл за 15–20 мин (болюсно)</li>
<li>Промыть зонд 30–50 мл воды после кормления</li>
<li>Зажать зонд, снять шприц</li>
</ol></div>
<h4>Через гастростому:</h4>
<ul>
<li>Кожу вокруг трубки обработать антисептиком и закрыть стерильной салфеткой</li>
<li>Подсоединить систему с питательной смесью к трубке гастростомы</li>
<li>Скорость введения — капельно или болюсно по назначению врача</li>
<li>После кормления промыть кипячёной водой</li>
<li>Трубку закрыть заглушкой</li>
</ul>
<div class="tip">Питательные смеси: Нутризон, Фрезубин, молочные смеси, овощные пюре</div>`},
{type:'skill', q:'Использование медицинской одежды и СИЗ, надевание и смена стерильных перчаток',
a:`<h4>Медицинская одежда (СИЗ):</h4>
<ul>
<li><strong>Халат/хирургический костюм</strong> — надевается при входе в отделение</li>
<li><strong>Маска</strong> — закрывает нос и рот, меняется каждые 2–4 часа</li>
<li><strong>Шапочка</strong> — убирает все волосы</li>
<li><strong>Очки/щиток</strong> — при риске брызг биологических жидкостей</li>
<li><strong>Фартук</strong> — при работе с дезрастворами</li>
</ul>
<h4>Алгоритм надевания стерильных перчаток:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Вымыть и высушить руки, обработать антисептиком</li>
<li>Открыть упаковку, не касаясь внутренней стороны</li>
<li>Взять правую перчатку <strong>левой рукой за отворот</strong></li>
<li>Надеть на правую руку, не распрямляя отворот</li>
<li>Завести пальцы правой руки (в перчатке) под отворот левой перчатки</li>
<li>Надеть левую перчатку, расправить отворот</li>
<li>Расправить отворот правой перчатки</li>
</ol></div>
<div class="warning">Снятие: снимать «от запястья», выворачивая наизнанку, не касаясь открытой кожи</div>`}
]},

{n:3, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Синкопальное состояние (обморок), понятие, клинические признаки и обязанности медсестры при оказании неотложной помощи',
a:`<p><strong>Синкопе (обморок)</strong> — кратковременная внезапная потеря сознания, обусловленная преходящей ишемией головного мозга.</p>
<h4>Причины:</h4>
<ul><li>Резкое вставание (ортостатический), боль, стресс (вазовагальный)</li>
<li>Нарушения ритма сердца, гипогликемия, анемия</li></ul>
<h4>Клиника:</h4>
<ul>
<li><strong>Предобморок:</strong> головокружение, потемнение в глазах, слабость, шум в ушах, бледность, потливость</li>
<li><strong>Обморок:</strong> потеря сознания, мышечная слабость, бледность, холодный пот, редкий нитевидный пульс, снижение АД</li>
<li><strong>Продолжительность:</strong> секунды — 3 мин</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Уложить горизонтально, <strong>приподнять ноги</strong> на 20–30 см</li>
<li>Обеспечить свежий воздух, расстегнуть стесняющую одежду</li>
<li>Дать понюхать нашатырный спирт (10% р-р аммиака) на расстоянии</li>
<li>Обрызгать лицо холодной водой, похлопать по щекам</li>
<li>Измерить АД и пульс</li>
<li>При восстановлении сознания — горячий чай, оставить лежать 10 мин</li>
<li>Вызвать врача при длительном или повторном обмороке</li>
</ol></div>`},
{type:'skill', q:'Обработка рук дезинфицирующими растворами (гигиеническими антисептиками)',
a:`<h4>Уровни обработки рук:</h4>
<ul>
<li><strong>Социальный</strong> — мытьё с мылом (бытовые процедуры)</li>
<li><strong>Гигиенический</strong> — мытьё + антисептик (перед большинством процедур)</li>
<li><strong>Хирургический</strong> — расширенная обработка перед операциями</li>
</ul>
<h4>Алгоритм гигиенической обработки (EN 1500 — 6 шагов):</h4>
<div class="algo"><div class="algo-title">Нанести 3 мл антисептика, растирать 30 секунд</div><ol>
<li><strong>Ладонь к ладони</strong> — растирать</li>
<li><strong>Ладонь на тыл</strong> — правой по тылу левой и наоборот</li>
<li><strong>Пальцы в замок</strong> — межпальцевые пространства</li>
<li><strong>Тыльная сторона согнутых пальцев</strong> по ладони</li>
<li><strong>Вращательные движения</strong> вокруг большого пальца</li>
<li><strong>Вращательные движения</strong> кончиками пальцев по ладони</li>
</ol></div>
<div class="tip">Не смывать! Антисептик должен полностью высохнуть на руках</div>`},
{type:'skill', q:'Подготовка больных к операции',
a:`<h4>Предоперационная подготовка делится на:</h4>
<h4>1. Психологическая подготовка:</h4>
<ul><li>Информирование пациента о предстоящей операции и анестезии</li>

<li>При необходимости — седативные препараты</li></ul>
<h4>2. Накануне вечером:</h4>
<ul>

<li>Гигиеническая ванна или душ</li>

</ul>
<h4>3. Утром в день операции:</h4>

<li>Опорожнить мочевой пузырь</li>

<li>Транспортировать на каталке</li>
</ul>`}
]},

a:`<p><strong>Гипертонический криз</strong> — острое значительное повышение АД (как правило, выше 180/110 мм рт. ст.) с поражением органов-мишеней или без него.</p>
<h4>Типы:</h4>

<li><strong>Неосложнённый</strong> — нет острого поражения органов-мишеней</li>

</ul>
<h4>Клиника:</h4>
<ul>
<li>Резкая <strong>головная боль</strong> (затылок), головокружение</li>
<li>Тошнота, рвота</li>
<li>Мелькание «мушек» перед глазами</li>
<li>Покраснение лица, сердцебиение</li>
<li>Онемение, слабость конечностей</li>
<li>Возможны: одышка, загрудинная боль, нарушение сознания</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>

<li>Измерить АД на обеих руках, зафиксировать</li>
<li>Обеспечить покой, тишину, свежий воздух</li>
<li>Холодный компресс на лоб, горчичники на икры</li>
<li>До прихода врача — дать назначенный препарат (каптоприл 25 мг п/я, нифедипин)</li>
<li>Контроль АД каждые 15 мин</li>
<li>Готовить в/в доступ</li>
</ol></div>

{type:'skill', q:'Проведение сердечно-лёгочной реанимации (СЛР)',
a:`<h4>Показания: отсутствие сознания, дыхания и пульса</h4>

</ol></div>
<div class="tip">Смена реаниматора — каждые 2 минуты для профилактики усталости</div>`},
{type:'skill', q:'Катетеризация мочевого пузыря мягким катетером',
a:`<h4>Алгоритм (у женщин):</h4>

<li>Обработать наружные половые органы антисептиком (от уретры кнаружи)</li>

<li>Дождаться появления мочи → катетер на месте</li>

<h4>У мужчин (отличия):</h4>

{n:5, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Острый коронарный синдром (ОКС), понятие, клинические признаки и обязанности медсестры',
a:`<p><strong>ОКС</strong> — спектр состояний от нестабильной стенокардии до инфаркта миокарда, вызванных острым нарушением коронарного кровообращения.</p>
<h4>Клиника:</h4>
<ul>
<li><strong>Боль за грудиной</strong> давящего, жгучего характера, иррадиирует в левую руку, плечо, челюсть, спину</li>
<li>Продолжительность более 20 мин, не купируется нитроглицерином</li>
<li>Бледность, холодный пот, слабость, страх смерти</li>
<li>Тахикардия или брадикардия, снижение АД</li>
<li>Одышка (при отёке лёгких)</li>
</ul>
<h4>Действия медсестры — алгоритм МОНАБ:</h4>
<div class="algo"><div class="algo-title">М-О-Н-А-Б</div><ol>
<li><strong>М</strong> — Мониторинг (ЭКГ, АД, пульс, SpO₂)</li>
<li><strong>О</strong> — Оксигенотерапия при SpO₂ &lt;94% (маска 4–8 л/мин)</li>
<li><strong>Н</strong> — Нитроглицерин 0,5 мг под язык (при АД &gt;90 мм рт. ст.)</li>
<li><strong>А</strong> — Аспирин 300 мг разжевать</li>
<li><strong>Б</strong> — Бета-блокатор по назначению врача</li>
</ol></div>
<ul>
<li>Немедленно вызвать врача/скорую</li>
<li>Уложить, обеспечить покой</li>
<li>Установить в/в катетер</li>
<li>Снять ЭКГ</li>
<li>Готовиться к тромболизису/ПКВ</li>
</ul>`},
{type:'skill', q:'Расчёт водного баланса у больного',
a:`<p><strong>Водный баланс</strong> = объём поступившей жидкости − объём выделенной жидкости за сутки.</p>
<h4>Учёт поступившей жидкости:</h4>
<ul>
<li>Питьё (вода, чай, суп, соки) — мерять мензуркой</li>
<li>Парентеральные растворы (капельницы)</li>
<li>Жидкие блюда и продукты</li>
</ul>
<h4>Учёт выделенной жидкости:</h4>
<ul>
<li>Моча (диурез — измерять мочеприёмником или судном)</li>
<li>Рвота, отделяемое из дренажей</li>
<li>Перспирация: ~500 мл/сут (при t° нормальной), при повышении t° на каждый градус +100–150 мл</li>
<li>Стул жидкий — учитывать</li>
</ul>
<h4>Норма:</h4>
<p>Диурез должен составлять <strong>70–80%</strong> от выпитой жидкости.<br>
Суточная норма мочи: <strong>1000–1800 мл</strong></p>
<h4>Интерпретация:</h4>
<ul>
<li><strong>Положительный баланс</strong> (+) → задержка жидкости, отёки</li>
<li><strong>Отрицательный баланс</strong> (−) → обезвоживание</li>
</ul>
<div class="tip">Записывать каждые 3 часа, итог подводить в 6:00 утра</div>`},
{type:'skill', q:'Введение зонда в желудок, промывание желудка через толстый зонд',
a:`<h4>Введение назогастрального зонда:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Измерить длину зонда: мочка уха → кончик носа → мечевидный отросток (45–55 см)</li>
<li>Пациент сидит, голова наклонена вперёд</li>
<li>Смазать зонд вазелином</li>
<li>Ввести через нос (или рот) по нижнему носовому ходу</li>
<li>При глотательных движениях продвигать зонд вглубь</li>
<li>Проверить положение: вдуть 20 мл воздуха шприцем, аускультировать (булькание в проекции желудка)</li>
<li>Зафиксировать пластырем к носу</li>
</ol></div>
<h4>Промывание желудка (толстый зонд):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Ввести толстый зонд через рот до метки 55–65 см</li>
<li>Подсоединить воронку 500 мл</li>
<li>Налить тёплой воды (36°C), поднять воронку вверх</li>
<li>Опустить воронку ниже уровня желудка — вода стечёт с содержимым</li>
<li>Слить в таз, повторить до чистых промывных вод</li>
<li>Всего промывной жидкости: 8–10 литров</li>
</ol></div>
<div class="warning">При отравлениях — первую порцию промывных вод отправить на анализ</div>`}
]},

<p><strong>Норма:</strong> 36,0–36,9°C. Субфебрилитет: 37–38°C, высокая: 38–39°C, очень высокая: >39°C</p>

{type:'skill', q:'Проведение кислородной терапии разными способами',
a:`<h4>Показания:</h4>

{n:7, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Геморрагический шок, понятие, клинические признаки и обязанности медсестры',
a:`<p><strong>Геморрагический шок</strong> — острая недостаточность кровообращения вследствие массивной кровопотери.</p>
<h4>Степени (по объёму кровопотери):</h4>
<ul>
<li><strong>I (компенсированный)</strong> — до 15% ОЦК (750 мл): тахикардия до 100/мин, АД норма</li>
<li><strong>II (субкомпенсированный)</strong> — 15–30% (750–1500 мл): тахикардия 100–120, АД ↓</li>
<li><strong>III (декомпенсированный)</strong> — 30–40% (1500–2000 мл): ЧСС >120, АД &lt;90, бледность, ↓ диурез</li>
<li><strong>IV (необратимый)</strong> — >40%: АД &lt;70, нитевидный пульс, анурия, потеря сознания</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Остановить видимое кровотечение (жгут, давящая повязка, прижатие)</li>
<li>Вызвать врача/хирурга</li>
<li>Уложить горизонтально, ноги приподнять</li>
<li>Установить 2 в/в катетера большого диаметра (14–16G)</li>
<li>Начать инфузию: физраствор, полиглюкин, коллоиды — быстро</li>
<li>Оксигенотерапия 8–10 л/мин</li>
<li>Мониторинг АД, ЧСС, SpO₂, диуреза</li>
<li>Определить группу крови, подготовить к гемотрансфузии</li>
</ol></div>`},
{type:'skill', q:'Подготовка и прикладывание пакета со льдом',
a:`<h4>Показания:</h4>

<h4>Алгоритм:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Заполнить пузырь льдом на 2/3 (мелко наколотым)</li>
<li>Выпустить воздух, завинтить крышку</li>
<li>Проверить на герметичность (перевернуть)</li>
<li>Обернуть полотенцем в 2 слоя (нельзя прикладывать лёд голой поверхностью!)</li>
<li>Приложить на место процедуры на <strong>20–30 минут</strong></li>
<li>Сделать перерыв 10–15 мин, при необходимости повторить</li>
</ol></div>
<div class="warning">Не прикладывать более 30 минут непрерывно — риск отморожения!</div>`},
{type:'skill', q:'Подготовка и наложение грелки на пациента',
a:`<h4>Показания:</h4>
<p>Спазм гладкой мускулатуры, боли (хронические), переохлаждение, гематомы (после 24–48 часов)</p>
<h4>Противопоказания:</h4>
<p>Острый живот, опухоли, кровотечения, гнойные воспаления, нарушение кожной чувствительности</p>
<h4>Алгоритм:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Наполнить грелку горячей водой (60–70°C) на 2/3</li>
<li>Вытеснить воздух, завинтить пробку</li>
<li>Перевернуть, проверить на герметичность</li>
<li>Обернуть полотенцем</li>
<li>Приложить к нужной области на <strong>20 минут</strong></li>
<li>Через 5 мин проверить состояние кожи (покраснение, ожог)</li>
</ol></div>
<div class="warning">Не применять при острой боли в животе неясного происхождения!</div>`}
]},

{n:8, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Анафилактический шок, понятие, клинические симптомы и обязанности медсестры',
a:`<p><strong>Анафилактический шок</strong> — жизнеугрожающая системная аллергическая реакция немедленного типа, с резким падением АД и полиорганной недостаточностью.</p>
<h4>Причины:</h4>
<ul><li>Лекарства (антибиотики, НПВС, рентгеноконтраст)</li>
<li>Пища (орехи, морепродукты), укусы насекомых</li></ul>
<h4>Клиника (первые минуты — до 30 мин):</h4>
<ul>
<li>Кожный зуд, крапивница, ангионевротический отёк</li>
<li>Бронхоспазм — свистящее дыхание, удушье</li>
<li>АД резко падает, тахикардия</li>
<li>Потеря сознания, судороги</li>
</ul>
<h4>Действия медсестры — НЕМЕДЛЕННО:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Прекратить введение аллергена</li>
<li>Вызвать реанимационную бригаду, вызвать врача</li>
<li>Уложить: горизонтально + ноги приподнять</li>
<li><strong>Адреналин 0,1% — 0,5 мл в/м</strong> (в бедро) — СРАЗУ, без ожидания врача!</li>
<li>Оксигенотерапия 8–10 л/мин</li>
<li>Установить в/в катетер, инфузия физраствора</li>
<li>Преднизолон 90–120 мг в/в (по назначению или при наличии протокола)</li>
<li>Антигистаминные в/в: димедрол, супрастин</li>
<li>Мониторинг АД, ЧСС, SpO₂</li>
</ol></div>
<div class="warning">Адреналин — препарат первой линии! Вводится до прихода врача при жизнеугрожающих симптомах</div>`},
{type:'skill', q:'Наложение компресса (локальное прогревание и замораживание)',
a:`<h4>Согревающий компресс:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Марлю (8 слоёв) смочить в 40–45°C воде или 45% спирте, отжать</li>
<li>Наложить на кожу</li>
<li>Покрыть клеёнкой или компрессной бумагой (чуть шире марли)</li>
<li>Укутать ватой или тёплой тканью (шире предыдущего слоя)</li>
<li>Зафиксировать бинтом, держать <strong>6–8 часов</strong></li>
</ol></div>
<h4>Холодный компресс:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Марлю смочить в холодной воде (со льдом), отжать</li>
<li>Наложить на область (лоб, место ушиба)</li>
<li>Менять каждые <strong>2–3 минуты</strong></li>
<li>Держать 20–30 минут</li>
</ol></div>
<div class="tip">Согревающий компресс: применяется при хронических воспалениях, ушибах &gt;24 ч, отитах</div>`},
{type:'skill', q:'Взятие крови из вены на анализ',
a:`<h4>Алгоритм венепункции:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Надеть перчатки, обработать руки антисептиком</li>
<li>Подготовить вакутайнер нужного цвета (красный — биохимия, фиолетовый — ОАК, синий — коагулограмма)</li>
<li>Наложить жгут на плечо (на 7–10 см выше локтя)</li>
<li>Попросить сжать кулак</li>
<li>Обработать кожу спиртом, дождаться высыхания</li>
<li>Ввести иглу под углом 15–30° срезом вверх</li>
<li>Подсоединить вакутайнер, дождаться наполнения</li>
<li>Снять жгут, вынуть вакутайнер, затем иглу</li>
<li>Прижать место пункции стерильным шариком 3–5 мин</li>
<li>Перевернуть вакутайнер с антикоагулянтом 8–10 раз</li>
</ol></div>
<div class="warning">Жгут не должен давить более 1 минуты — ложное повышение показателей!</div>`}
]},

{n:9, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Астматический статус, понятие, клинические симптомы и обязанности медсестры',
a:`<p><strong>Астматический статус</strong> — тяжёлый, затяжной приступ бронхиальной астмы, не поддающийся обычной бронхолитической терапии, длительностью >30 мин.</p>
<h4>Клиника:</h4>
<ul>
<li>Выраженная экспираторная одышка (удлинённый выдох)</li>
<li>Участие вспомогательных мышц в дыхании</li>
<li>Цианоз, потливость</li>
<li>ЧДД >30/мин, SpO₂ &lt;92%</li>
<li>Пульс парадоксальный (ЧСС снижается на вдохе)</li>
<li>В лёгких — свистящие хрипы, затем «немые лёгкие» (III стадия — крайне опасно!)</li>
<li>Вынужденное положение — сидя с упором на руки</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Вызвать врача, приготовить реанимационный набор</li>
<li>Усадить в положении с упором (ортопное)</li>
<li>Оксигенотерапия 4–8 л/мин через маску</li>
<li>Ингалятор с бронхолитиком (сальбутамол через небулайзер)</li>
<li>В/в доступ, вводить по назначению: эуфиллин, преднизолон</li>
<li>Мониторинг SpO₂, ЧДД, ЧСС</li>
<li>Готовить к переводу в ОРИТ</li>
</ol></div>`},
{type:'skill', q:'Введение лекарств с помощью шприца-дозатора и инфузомата',
a:`<h4>Инфузомат (инфузионный насос):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Подготовить флакон с раствором, систему для инфузомата</li>
<li>Заправить систему, удалить воздух</li>
<li>Закрепить флакон в держателе аппарата</li>
<li>Установить скорость (мл/час) согласно назначению врача</li>
<li>Подключить к периферическому или центральному катетеру пациента</li>
<li>Нажать «Старт», убедиться в работе</li>
<li>Контролировать место введения и показатели</li>
</ol></div>
<h4>Шприц-дозатор (перфузор):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Набрать препарат в 20 или 50 мл шприц</li>
<li>Установить шприц в аппарат, зафиксировать</li>
<li>Установить скорость в мл/час</li>
<li>Подсоединить удлинительную трубку к катетеру</li>
<li>Нажать «Старт»</li>
</ol></div>
<div class="tip">Преимущество: точная дозировка, особенно для вазоактивных препаратов (допамин, норадреналин, гепарин)</div>`},
{type:'skill', q:'Осуществление внутривенного капельного введения лекарств',
a:`<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Обработать руки антисептиком, надеть перчатки</li>
<li>Проверить назначение: препарат, дозу, скорость, совместимость</li>
<li>Приготовить систему (капельница), флакон с раствором</li>
<li>Перевернуть флакон, ввести иглу системы, подвесить на стойку</li>
<li>Заполнить систему раствором (перевернуть капельницу), удалить воздух</li>
<li>Венепункция или подключение к катетеру</li>
<li>Открыть зажим, отрегулировать скорость (счётчик капель): 
обычно 40–60 кап/мин = 120–180 мл/час</li>
<li>Зафиксировать иглу/катетер пластырем</li>
<li>Подписать систему (препарат, время, скорость)</li>
<li>Контролировать место введения, состояние пациента</li>
</ol></div>
<div class="warning">При экстравазации (отёк, боль вне вены) — немедленно прекратить, сообщить врачу</div>`}
]},

{n:10, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Асфиксия, понятие, клинические признаки и обязанности медсестры',
a:`<p><strong>Асфиксия</strong> — остро развившаяся кислородная недостаточность вследствие механического препятствия для дыхания или прекращения поступления воздуха.</p>
<h4>Причины:</h4>
<ul>
<li>Инородное тело в дыхательных путях</li>
<li>Западание языка (бессознательное состояние)</li>
<li>Отёк гортани (аллергия, ожог)</li>
<li>Утопление, удушение</li>
<li>Опухоль трахеи/гортани</li>
</ul>
<h4>Клиника:</h4>
<ul>
<li>Резкое затруднение дыхания, нарастающая одышка</li>
<li>Цианоз, потливость</li>
<li>Участие вспомогательных мышц</li>
<li>Беспокойство, страх, хватание за горло</li>
<li>Потеря сознания, остановка дыхания</li>
</ul>
<h4>Действия медсестры:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Вызвать врача/реанимационную бригаду</li>
<li>При инородном теле: приём Геймлиха (5 резких толчков под диафрагму)</li>
<li>Запрокинуть голову, выдвинуть нижнюю челюсть, открыть рот</li>
<li>Удалить видимое инородное тело, аспирировать слизь</li>
<li>Оксигенотерапия; при апноэ — ИВЛ</li>
<li>Готовить к интубации трахеи или коникотомии</li>
</ol></div>`},
{type:'skill', q:'Анализ ЭКГ (нормальные показатели)',
a:`<h4>Нормальная ЭКГ (синусовый ритм):</h4>
<ul>
<li><strong>ЧСС:</strong> 60–90 уд/мин (интервал R–R 0,66–1,0 сек)</li>
<li><strong>Ритм:</strong> правильный (синусовый), зубец P перед каждым QRS</li>
<li><strong>Зубец P:</strong> положительный, 0,06–0,10 с, ≤0,25 мВ</li>
<li><strong>Интервал PQ:</strong> 0,12–0,20 с (АВ-проводимость)</li>
<li><strong>Комплекс QRS:</strong> 0,06–0,10 с (внутрижелудочковая проводимость)</li>
<li><strong>Сегмент ST:</strong> на изолинии (±1 мм)</li>
<li><strong>Зубец T:</strong> положительный в большинстве отведений</li>
<li><strong>Интервал QT:</strong> 0,36–0,44 с</li>
<li><strong>Электрическая ось сердца (ЭОС):</strong> нормальная (0°–+90°)</li>
</ul>
<h4>Отведения:</h4>
<p>I, II, III — стандартные; aVR, aVL, aVF — усиленные; V1–V6 — грудные</p>`},
{type:'skill', q:'Наложение повязки «Чепец»',
a:`<h4>Показания: травма, рана, операция на голове</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Взять бинт 10 см шириной</li>
<li>Отрезать завязку ~80 см, положить её на темя как коромысло, оба конца свесить перед ушами</li>
<li>Пациент держит концы завязки руками</li>
<li>Сделать два закрепляющих тура вокруг головы</li>
<li>Дойдя до завязки, обогнуть её и перейти на верхний тур</li>
<li>Чередовать туры: каждый раз оборачивать вокруг завязки</li>
<li>Закрыть всю поверхность головы</li>
<li>Последний тур — закрепить вокруг головы</li>
<li>Завязать концы завязки под подбородком</li>
</ol></div>`}
]},

{n:11, tags:['org','skill'],
qs:[
{type:'theory', q:'Сущность и особенности работы медицинской сестры. Основные задачи.',
a:`<h4>Медицинская сестра — специалист со средним медицинским образованием, осуществляющий уход, лечебно-диагностические процедуры и профилактику под руководством врача.</h4>
<h4>Основные задачи:</h4>
<ul>
<li>Выполнение врачебных назначений (инъекции, капельницы, процедуры)</li>
<li>Уход за пациентами (гигиена, питание, профилактика пролежней)</li>
<li>Контроль состояния больных (АД, ЧСС, температура, диурез)</li>
<li>Ведение медицинской документации</li>
<li>Обучение пациентов и родственников</li>
<li>Обеспечение инфекционной безопасности</li>
<li>Санитарно-просветительская работа</li>
</ul>
<h4>Функции медсестры:</h4>
<ul>
<li><strong>Зависимая</strong> — выполнение назначений врача</li>
<li><strong>Независимая</strong> — самостоятельный уход (гигиена, положение в постели)</li>
<li><strong>Взаимозависимая</strong> — работа в команде с врачом, санитаром</li>
</ul>`},
{type:'skill', q:'Внутривенная инъекция',
a:`<div class="algo"><div class="algo-title">Алгоритм в/в инъекции</div><ol>
<li>Обработать руки антисептиком, надеть перчатки</li>
<li>Набрать препарат в шприц, удалить воздух</li>
<li>Наложить жгут на 7–10 см выше локтя, пациент сжимает кулак</li>
<li>Обработать кожу спиртом (от центра к периферии), дать высохнуть</li>
<li>Натянуть кожу, ввести иглу под углом 15–30° срезом вверх, параллельно вене</li>
<li>Потянуть поршень — появление крови = игла в вене</li>
<li>Снять жгут, попросить пациента разжать кулак</li>
<li>Ввести препарат медленно (при не раздражающих — быстрее)</li>
<li>Прижать стерильный шарик, извлечь иглу</li>
<li>Держать шарик 3–5 мин</li>
</ol></div>
<div class="warning">Вводить только после разведения! Проверить совместимость, срок годности, прозрачность</div>`},
{type:'skill', q:'Взятие крови из вены на анализ (повтор, см. Билет 8)',
a:`<p>Алгоритм аналогичен Билету 8 — с использованием вакутайнеров.</p>
<h4>Таблица вакутайнеров:</h4>
<ul>
<li>🔴 Красный (без добавок) — биохимия, группа крови</li>
<li>🟣 Фиолетовый (ЭДТА) — ОАК, гликозилированный гемоглобин</li>
<li>🔵 Синий (цитрат натрия) — коагулограмма</li>
<li>🟢 Зелёный (гепарин) — некоторые биохимические тесты</li>
<li>⚫ Чёрный (цитрат натрия) — СОЭ</li>
</ul>
<div class="tip">Порядок заполнения: синий → красный → зелёный → фиолетовый</div>`}
]},

{n:12, tags:['org','skill'],
qs:[
{type:'theory', q:'Правила техники безопасности при уходе за больными',
a:`<h4>1. Инфекционная безопасность:</h4>
<ul>
<li>Обработка рук антисептиком до и после каждой процедуры</li>
<li>Использование СИЗ: перчатки, маска, халат</li>
<li>Соблюдение асептики при инъекциях и манипуляциях</li>
</ul>
<h4>2. Безопасность при работе с острыми предметами:</h4>
<ul>
<li>Не надевать колпачок на использованную иглу двумя руками</li>
<li>Утилизировать иглы в контейнер класса «Б» (жёлтый)</li>
<li>При уколе иглой: выдавить кровь, обработать 70% спиртом, сообщить руководителю, провести постэкспозиционную профилактику</li>
</ul>
<h4>3. Эргономика (профилактика травм у персонала):</h4>
<ul>
<li>Правила перемещения пациентов: спина прямая, ноги согнуты, нагрузка на ноги</li>
<li>Использовать подъёмники, скользящие простыни</li>
<li>Не поднимать более 10 кг в одиночку</li>
</ul>
<h4>4. Работа с электрооборудованием:</h4>
<ul><li>Не трогать мокрыми руками, заземление, проверка перед работой</li></ul>
<h4>5. Работа с химическими веществами:</h4>
<ul><li>Дезрастворы готовить в перчатках, фартуке, очках, в проветриваемом помещении</li></ul>`},
{type:'skill', q:'Выполнение внутримышечной инъекции',
a:`<h4>Места введения (наиболее часто):</h4>
<ul>
<li><strong>Верхненаружный квадрант ягодицы</strong> — основное место</li>
<li>Бедро (переднелатеральная поверхность), дельтовидная мышца</li>
</ul>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Обработать руки антисептиком, надеть перчатки</li>
<li>Набрать препарат, удалить воздух (0,1–0,2 мл выпустить)</li>
<li>Пациент лежит на животе или боку, мышца расслаблена</li>
<li>Обработать кожу спиртом (от центра кнаружи), дать высохнуть</li>
<li>Растянуть или взять кожу в складку (у худых)</li>
<li>Ввести иглу под углом <strong>90°</strong> на 2/3 длины (3–4 см)</li>
<li>Потянуть поршень — нет крови = в мышце</li>
<li>Ввести препарат медленно (1–2 мл/мин)</li>
<li>Прижать шарик, извлечь иглу резким движением</li>
<li>Лёгкий массаж места инъекции</li>
</ol></div>
<div class="warning">При попадании крови в шприц — вытащить иглу, сменить иглу и место введения</div>`},
{type:'skill', q:'Местное применение лекарств',
a:`<h4>Способы местного применения:</h4>
<ul>
<li><strong>Накожно:</strong> мази (от центра раны кнаружи), пластыри, присыпки — надеть перчатки, нанести шпателем</li>
<li><strong>В глаза:</strong> пациент запрокидывает голову, смотрит вверх, оттянуть нижнее веко, закапать в конъюнктивальный мешок, не касаясь пипеткой глаза</li>
<li><strong>В уши:</strong> оттянуть ухо назад-вверх (взрослые) или назад-вниз (дети), закапать подогретые капли (37°C)</li>
<li><strong>В нос:</strong> голова запрокинута, закапать в каждую ноздрю, подождать 1–2 мин</li>
<li><strong>Ректально:</strong> суппозитории — пациент на боку, колено к животу, ввести за сфинктер</li>
<li><strong>Интравагинально:</strong> таблетки, свечи, кремы</li>
<li><strong>Полоскание рта:</strong> горло</li>
<li><strong>Ингаляционно:</strong> небулайзер, спрей</li>
</ul>`}
]},

{n:13, tags:['org','skill'],
qs:[
{type:'theory', q:'Основы медицинской этики и деонтологии сестринского дела',
a:`<p><strong>Медицинская этика</strong> — совокупность норм морали и поведения медицинского работника.</p>
<p><strong>Деонтология</strong> (от греч. deon — долг) — учение о профессиональном долге медицинского работника.</p>
<h4>Основные принципы:</h4>
<ul>
<li><strong>Не навреди</strong> (Primum non nocere)</li>
<li><strong>Автономия</strong> — уважение права пациента на самоопределение</li>
<li><strong>Справедливость</strong> — равный доступ к медицинской помощи</li>
<li><strong>Благодеяние</strong> — действие в интересах пациента</li>
</ul>
<h4>Правила:</h4>
<ul>
<li>Соблюдать <strong>врачебную тайну</strong> и конфиденциальность</li>
<li>Уважать достоинство пациента, не допускать унижений</li>
<li>Получать <strong>информированное согласие</strong> перед процедурами</li>
<li>Не принимать подарки и вознаграждения</li>
<li>Поддерживать профессиональный уровень (непрерывное образование)</li>
<li>Корректное общение с коллегами (не критиковать при пациенте)</li>
</ul>`},
{type:'skill', q:'Выполнение подкожной инъекции',
a:`<h4>Места введения:</h4>
<p>Передненаружная поверхность плеча, бедро, живот (5 см от пупка), подлопаточная область</p>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Обработать руки, надеть перчатки</li>
<li>Набрать препарат (инсулин, гепарин, вакцины), удалить воздух</li>
<li>Обработать место инъекции спиртом, дать высохнуть</li>
<li>Взять кожу в складку двумя пальцами</li>
<li>Ввести иглу под углом <strong>45°</strong> на 1–2 см</li>
<li>Опустить складку, потянуть поршень (нет крови)</li>
<li>Ввести препарат медленно</li>
<li>Прижать шарик, извлечь иглу</li>
<li>Не массировать (особенно гепарин, инсулин!)</li>
</ol></div>
<div class="tip">Инсулин: вводить медленно (20 сек на 1 ЕД), чередовать места, температура 37°C</div>`},
{type:'skill', q:'Выдача лекарств пациентам',
a:`<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Сверить назначение листа с упаковкой: препарат, доза, форма, срок годности</li>
<li>Подготовить нужное количество таблеток (не касаться руками без перчаток)</li>
<li>Подойти к пациенту, назвать его ФИО (сверить браслет)</li>
<li>Объяснить: название, дозу, как принимать (до/после еды, запивать водой)</li>
<li>Убедиться, что пациент принял лекарство при вас (особенно психиатрия)</li>
<li>Записать в лист назначений о выполнении</li>
</ol></div>
<h4>Правило 5 «П»:</h4>
<ul>
<li>Правильный <strong>Пациент</strong></li>
<li>Правильный <strong>Препарат</strong></li>
<li>Правильная <strong>Доза</strong></li>
<li>Правильный <strong>Путь</strong> введения</li>
<li>Правильное <strong>Время</strong></li>
</ul>
<div class="warning">Сильнодействующие и наркотические препараты — строго по журналу, под ключ</div>`}
]},

{n:14, tags:['org','skill'],
qs:[
{type:'theory', q:'Принципы межличностного общения в сестринском деле',
a:`<h4>Уровни общения медсестры с пациентом:</h4>
<ul>
<li><strong>Вербальное</strong> — слова, речь (ясные, понятные объяснения)</li>
<li><strong>Невербальное</strong> — жесты, мимика, поза, взгляд</li>
<li><strong>Паравербальное</strong> — тон, тембр, скорость речи</li>
</ul>
<h4>Принципы эффективного общения:</h4>
<ul>
<li><strong>Активное слушание</strong> — смотреть на пациента, не перебивать, кивать</li>
<li><strong>Эмпатия</strong> — понимать и принимать чувства пациента</li>
<li><strong>Уважение</strong> — обращаться по имени-отчеству</li>
<li><strong>Доступность</strong> — избегать медицинских терминов</li>
<li><strong>Конфиденциальность</strong> — разговор не при посторонних</li>
<li><strong>Обратная связь</strong> — убедиться, что пациент понял</li>
</ul>
<h4>Барьеры общения:</h4>
<ul><li>Боль и тревога пациента</li>
<li>Языковые и культурные различия</li>
<li>Усталость, спешка персонала</li></ul>`},
{type:'skill', q:'Санитарно-гигиеническое обследование при поступлении, выявление педикулёза',
a:`<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Надеть перчатки, фартук, шапочку</li>
<li>Осмотр волосистых частей тела при хорошем освещении</li>
<li>Разделять волосы прядями, осматривать кожу головы</li>
<li><strong>Признаки педикулёза:</strong> гниды (яйца) у корней волос, зуд, расчёсы</li>
</ol></div>
<h4>При выявлении педикулёза:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Сообщить старшей медсестре, заполнить экстренное извещение (форма 058/у)</li>
<li>Нанести педикулицидный препарат (Медифокс, Паранит) на волосы</li>
<li>Выдержать время экспозиции согласно инструкции</li>
<li>Промыть волосы, расчесать частым гребнем</li>
<li>Обработать личные вещи, одежду (в дезинфекционной камере)</li>
<li>Завшивленную одежду упаковать в клеёнчатый мешок</li>
<li>Сделать отметку в документах («P» в красном кружке)</li>
</ol></div>`},
{type:'skill', q:'Организация и участие в транспортировке больных',
a:`<h4>Способы транспортировки:</h4>
<ul>
<li><strong>На каталке</strong> — тяжёлые больные, после операции, без сознания</li>
<li><strong>На кресле-каталке</strong> — при способности сидеть</li>
<li><strong>Пешком</strong> — лёгкие пациенты (под контролем)</li>
</ul>
<div class="algo"><div class="algo-title">Алгоритм транспортировки на каталке</div><ol>
<li>Проверить исправность каталки</li>
<li>Застелить чистой простынёй, взять одеяло</li>
<li>Переложить пациента (минимум 2 человека, синхронно)</li>
<li>Ноги пациента — к стене, при спуске — голова вперёд</li>
<li>При подъёме — ногами вперёд</li>
<li>Сопровождать, следить за состоянием</li>
<li>Передать с отчётом принимающей медсестре</li>
</ol></div>
<div class="warning">Пациент никогда не транспортируется один!</div>`}
]},

{n:15, tags:['org','skill'],
qs:[
{type:'theory', q:'Санитарно-эпидемиологические основы сестринского дела',
a:`<h4>Ключевые понятия:</h4>
<ul>
<li><strong>Асептика</strong> — предупреждение попадания микроорганизмов в рану и организм</li>
<li><strong>Антисептика</strong> — уничтожение микроорганизмов в ране и на коже</li>
<li><strong>Дезинфекция</strong> — уничтожение патогенных возбудителей во внешней среде</li>
<li><strong>Стерилизация</strong> — уничтожение всех микроорганизмов включая споры</li>
</ul>
<h4>ИСМП (инфекции, связанные с медицинской помощью):</h4>
<ul>
<li>Возникают у пациентов в результате пребывания в ЛПУ</li>
<li>Профилактика: обработка рук, асептика, обработка инструментов</li>
</ul>
<h4>Группы риска медсестры:</h4>
<ul>
<li>ВИЧ, гепатит B, C (контакт с кровью)</li>
<li>Туберкулёз (аэрозольный путь)</li>
<li>Профилактика: вакцинация, СИЗ, постэкспозиционная профилактика</li>
</ul>
<h4>Санитарно-эпидемиологический режим отделения:</h4>
<ul>
<li>Влажная уборка 2 раза в день + по мере загрязнения</li>
<li>Кварцевание палат</li>
<li>Соблюдение режима посещения</li>
</ul>`},
{type:'skill', q:'Определение индекса массы тела (ИМТ)',
a:`<h4>Формула:</h4>
<p style="font-size:16px;font-weight:bold;margin:.5rem 0">ИМТ = Масса тела (кг) / Рост² (м)</p>
<h4>Пример:</h4>
<p>Масса 70 кг, рост 1,70 м: ИМТ = 70 / (1,70 × 1,70) = 70 / 2,89 = <strong>24,2</strong></p>
<h4>Классификация ВОЗ:</h4>
<ul>
<li>&lt;16 — Дефицит массы тяжёлой степени</li>
<li>16–18,5 — Недостаточная масса тела</li>
<li>18,5–24,9 — <strong>Норма</strong></li>
<li>25–29,9 — Избыточная масса</li>
<li>30–34,9 — Ожирение I степени</li>
<li>35–39,9 — Ожирение II степени</li>
<li>≥40 — Ожирение III степени (морбидное)</li>
</ul>`},
{type:'skill', q:'Определение массы тела, роста и окружности груди',
a:`<h4>Взвешивание:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Медицинские весы установить на ровную поверхность, выверить</li>
<li>Пациент встаёт на весы в нижнем белье, утром натощак после мочеиспускания</li>
<li>Снять показания, занести в историю болезни</li>
</ol></div>
<h4>Измерение роста (ростомером):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Пациент стоит спиной к планке, пятки вместе</li>
<li>Касается планки: пятки, ягодицы, лопатки, затылок</li>
<li>Планку опустить до темени, снять показания</li>
</ol></div>
<h4>Измерение окружности грудной клетки:</h4>
<ul>
<li>Сантиметровую ленту провести сзади под углами лопаток</li>
<li>Спереди — по нижнему краю сосковых кружков (мужчины) или IV ребру (женщины)</li>
<li>Измерить на вдохе, выдохе и в паузе</li>
<li>Норма: разница вдох–выдох (экскурсия) = 6–9 см</li>
</ul>`}
]},

{n:16, tags:['org','hygiene'],
qs:[
{type:'theory', q:'Понятие и методы инфекционного контроля в больнице',
a:`<p><strong>Инфекционный контроль</strong> — система мер по профилактике ИСМП (внутрибольничных инфекций).</p>
<h4>Уровни обеззараживания:</h4>
<ul>
<li><strong>Дезинфекция высокого уровня (ДВУ)</strong> — уничтожает все, кроме большого количества спор</li>
<li><strong>Дезинфекция среднего уровня (ДСУ)</strong> — туберкулоциды, уничтожают вирусы</li>
<li><strong>Дезинфекция низкого уровня (ДНУ)</strong> — уничтожают вегетативные формы бактерий</li>
<li><strong>Стерилизация</strong> — уничтожает всё</li>
</ul>
<h4>Методы инфекционного контроля:</h4>
<ul>
<li>Стандартные меры предосторожности (СМП): перчатки при любом контакте с биологическими жидкостями</li>
<li>Изоляция инфекционных пациентов</li>
<li>Барьерный метод (боксы, палаты-изоляторы)</li>
<li>Контроль воздушной среды (вентиляция, HEPA-фильтры, УФ)</li>
<li>Обработка рук как главная мера</li>
</ul>`},
{type:'skill', q:'Работа с опасными медицинскими отходами',
a:`<h4>Классы медицинских отходов:</h4>
<ul>
<li><strong>Класс А</strong> (белый мешок) — незаразные отходы (бумага, упаковки)</li>
<li><strong>Класс Б</strong> (жёлтый) — потенциально инфицированные (перчатки, перевязочный материал)</li>
<li><strong>Класс В</strong> (красный) — высокоопасные (инфекционные, ООИ)</li>
<li><strong>Класс Г</strong> — химические, фарм. отходы</li>
<li><strong>Класс Д</strong> — радиоактивные</li>
</ul>
<h4>Обращение с острыми предметами (иглы, скальпели):</h4>
<ul>
<li>Утилизировать в контейнер класса Б (жёлтый, прокол не выполняется)</li>
<li>НЕ надевать колпачок двумя руками</li>
<li>Контейнер заполнять не более 3/4</li>
</ul>
<h4>Транспортировка:</h4>
<ul><li>Закрытые промаркированные контейнеры, специальный транспорт</li></ul>`},
{type:'skill', q:'Дезинфекция помещения и медицинского оборудования',
a:`<h4>Текущая уборка:</h4>
<ul>
<li>2 раза в день: утром и вечером</li>
<li>Дезраствором (0,5–1% хлорамин или современные средства) протирать поверхности, оборудование</li>
</ul>
<h4>Генеральная уборка:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Вынести всё лишнее, надеть СИЗ (перчатки, фартук, маска)</li>
<li>Нанести дезраствор на все поверхности, оборудование, стены на высоту 1,5 м</li>
<li>Выдержать экспозицию (по инструкции к препарату)</li>
<li>Протереть всё чистой ветошью со стерильной водой</li>
<li>Включить бактерицидные лампы (УФ) на 1–2 часа, проветрить</li>
<li>Записать в журнал генеральных уборок</li>
</ol></div>
<h4>Кратность:</h4>
<ul><li>Палаты — 1 раз в 7 дней</li><li>Операционные, перевязочные — после каждой операции + 1 раз в неделю</li></ul>`}
]},

{n:17, tags:['org','skill'],
qs:[
{type:'theory', q:'Организация сестринского дела в приёмном отделении. Основные задачи.',
a:`<h4>Функции приёмного отделения:</h4>
<ul>

<li>Санитарная обработка (осмотр, гигиеническая ванна/душ, переодевание)</li>
<li>Выявление педикулёза</li>

<li>Распределение по отделениям</li>

<h4>Медицинские документы приёмного отделения:</h4>

<li>История болезни (форма 003/у) — заполнение титульного листа</li>

{type:'skill', q:'Внутримышечная инъекция (алгоритм)',
a:`<p>Алгоритм аналогичен Билету 12. Дополнительно:</p>
<h4>Места введения:</h4>
<ul>
<li><strong>Ягодица (верхненаружный квадрант):</strong> провести линии — горизонтально через седалищный бугор и вертикально через большой вертел. Инъекция в верхненаружный сектор</li>
<li><strong>Бедро:</strong> средняя треть переднелатеральной поверхности</li>

<h4>Выбор иглы:</h4>

{type:'skill', q:'Надевание стерильного халата',
a:`<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Хирургическая обработка рук (стерильный уровень)</li>
<li>Взять халат из стерильного бикса за ворот, развернуть</li>

<li>Продеть обе руки одновременно в рукава</li>
<li>Санитарка завязывает завязки сзади (не касаясь стерильной стороны)</li>
<li>Пояс завязать самостоятельно, передавая концы через стерильный зажим</li>
<li>Надеть стерильные перчатки</li>
</ol></div>
<div class="warning">Стерильными считаются: перед и рукава до локтя. Не касаться не стерильных предметов!</div>`}
]},

{n:18, tags:['org','skill'],
qs:[
{type:'theory', q:'Организация работы постовой медсестры. Основные задачи.',
a:`<h4>Постовая (палатная) медсестра:</h4>
<p>Осуществляет непосредственное выполнение врачебных назначений и уход за пациентами своих палат.</p>
<h4>Обязанности:</h4>
<ul>
<li>Приём и передача дежурства (отчёт о состоянии пациентов)</li>
<li>Выполнение назначений листа назначений (инъекции, капельницы, таблетки)</li>
<li>Измерение АД, пульса, температуры, ЧДД, диуреза — запись в температурный лист</li>
<li>Контроль питания и передач из дома</li>
<li>Обеспечение санитарно-гигиенических условий в палате</li>
<li>Уход за тяжелобольными (гигиена, профилактика пролежней)</li>
<li>Ведение медицинской документации поста</li>
<li>Подготовка пациентов к исследованиям и операциям</li>
</ul>`},
{type:'skill', q:'Предстерилизационная очистка, дезинфекция, стерилизационный контроль',
a:`<h4>Этапы обработки медицинских изделий:</h4>
<h4>1. Дезинфекция (сначала!):</h4>
<ul>
<li>Погрузить в дезраствор (0,5–1% «Септодор», «Лизоформин», хлорамин)</li>
<li>Время экспозиции согласно инструкции</li>
</ul>
<h4>2. Предстерилизационная очистка (ПСО):</h4>
<ul>
<li>Ополоснуть проточной водой</li>
<li>Замочить в моющем растворе (перекись + порошок) при 50°C на 15 мин</li>
<li>Мыть ёршиком каждый предмет 30 сек</li>
<li>Ополоснуть проточной водой 10 мин, дистиллированной 1 мин</li>
<li>Высушить (сушильный шкаф 85°C)</li>
</ul>
<h4>3. Контроль качества ПСО:</h4>
<ul>
<li><strong>Амидопириновая проба</strong> — синий цвет = кровь (плохо очищено)</li>
<li><strong>Фенолфталеиновая проба</strong> — розовый = остатки моющего средства</li>
</ul>
<h4>4. Стерилизация:</h4>
<ul>
<li>Автоклав (паровой): 134°C/3,2 атм/5 мин или 121°C/2,0 атм/20 мин</li>
<li>Сухожаровой шкаф: 180°C/60 мин</li>
</ul>`},
{type:'skill', q:'Предварительная стерилизация инструментов',
a:`<p>Подробный алгоритм указан выше в Билете 18 (вопрос 2 — ПСО и стерилизация).</p>
<h4>Методы стерилизации и объекты:</h4>
<ul>
<li><strong>Автоклав</strong> — хирургические инструменты, перевязочный материал, бельё, резиновые перчатки</li>
<li><strong>Сухой жар</strong> — металлические инструменты, стекло (не резина!)</li>
<li><strong>Химическая стерилизация</strong> (глутаральдегид, надуксусная к-та) — эндоскопы, термолабильные изделия</li>
<li><strong>Гамма-излучение</strong> — промышленная стерилизация одноразовых изделий</li>
</ul>`}
]},

{n:19, tags:['org','skill'],
qs:[
{type:'theory', q:'Медицинские документы, заполняемые медицинскими сёстрами',
a:`<h4>Основные документы постовой медсестры:</h4>
<ul>
<li><strong>История болезни (форма 003/у)</strong> — ведётся врачом, медсестра заполняет сестринский лист</li>
<li><strong>Температурный лист</strong> — t°, АД, пульс, ЧДД, диурез, масса тела</li>
<li><strong>Лист назначений</strong> — отмечает выполненные назначения</li>
<li><strong>Журнал учёта наркотических средств</strong> — строгая отчётность</li>
<li><strong>Журнал регистрации переливания крови</strong></li>
<li><strong>Журнал стерилизации</strong> — дата, метод, контроль</li>
<li><strong>Журнал учёта генеральных уборок</strong></li>
<li><strong>Экстренное извещение (058/у)</strong> — при инфекционных заболеваниях</li>
<li><strong>Журнал постовой медсестры</strong> — состояние пациентов, выполненные манипуляции</li>
</ul>
<h4>Требования к заполнению:</h4>
<ul>
<li>Разборчиво, без исправлений (или с указанием «исправленному верить», подпись)</li>
<li>Синими/чёрными чернилами</li>
<li>Дата и время каждой записи</li>
<li>Подпись</li>
</ul>`},
{type:'skill', q:'Приготовление дезинфицирующих рабочих растворов',
a:`<h4>Пример: приготовление 1% раствора хлорамина из 25% порошка</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Надеть перчатки, фартук, маску, очки</li>
<li>Рассчитать: для 10 л 1% раствора из 25% → (1×10)/25 = <strong>400 г порошка</strong> + <strong>9,6 л воды</strong></li>
<li>Налить воду в ёмкость</li>
<li>Добавить порошок, перемешать до полного растворения</li>
<li>Наклеить этикетку: название, концентрация, дата приготовления, срок годности</li>
</ol></div>
<h4>Формула расчёта:</h4>
<p style="font-weight:bold;font-size:14px">V<sub>концентрата</sub> = (С<sub>нужная</sub> × V<sub>нужный</sub>) / С<sub>концентрата</sub></p>
<div class="tip">Готовые растворы хранить в тёмном прохладном месте, плотно закрытыми</div>
<div class="warning">Дезрастворы не смешивать между собой — возможна инактивация!</div>`},
{type:'skill', q:'Организация сбора общего анализа мочи и кала',
a:`<h4>Общий анализ мочи:</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Накануне провести туалет наружных половых органов</li>
<li>Утром первая утренняя порция мочи (средняя струя)</li>
<li>Объём: 50–100 мл в чистый контейнер</li>
<li>Доставить в лабораторию в течение 1–2 часов</li>
</ol></div>
<h4>Общий анализ кала (копрограмма):</h4>
<ul>
<li>За 3 дня исключить красящие продукты (свёкла, морковь)</li>
<li>Кал утренний, после естественной дефекации</li>
<li>Шпателем в контейнер (~1 чайная ложка, 5–10 г)</li>
<li>Не смешивать с мочой</li>
<li>Доставить свежим в течение 2 часов</li>
</ul>
<h4>Кал на скрытую кровь:</h4>
<ul><li>За 3 дня исключить мясо, рыбу, зелёные овощи, препараты железа</li></ul>`}
]},

{n:20, tags:['org','skill'],
qs:[
{type:'theory', q:'Основные задачи палатной медсестры терапевтического отделения',
a:`<h4>Палатная медсестра терапии отвечает за:</h4>
<ul>
<li>Выполнение <strong>всех назначений</strong> лечащего врача в срок</li>
<li>Динамический контроль состояния (АД, t°, ЧДД, диурез) 2 раза в сутки и по необходимости</li>
<li>Правильный уход за пациентами разного профиля (кардио, гастро, пульмоно)</li>
<li>Подготовку к плановым исследованиям (ФГДС, УЗИ, рентген)</li>
<li>Сбор анализов (кровь, моча, мокрота)</li>
<li>Организацию лечебного питания (диетические столы №1–15)</li>
<li>Обучение пациента самоконтролю (измерение АД, уровня сахара)</li>
<li>Передачу дежурства</li>
</ul>`},
{type:'skill', q:'Организация забора и доставки крови на лабораторное исследование',
a:`<h4>Правила забора:</h4>
<ul>
<li>Натощак (не менее 8–12 часов) — для большинства биохимических показателей</li>
<li>Коагулограмма — в голубой вакутайнер, строго: 9 частей крови + 1 часть цитрата</li>
<li>Соблюдать порядок заполнения вакутайнеров</li>
</ul>
<h4>Маркировка:</h4>
<ul>
<li>ФИО пациента, дата, отделение, вид анализа</li>
<li>Стикер на вакутайнер, направление в лабораторию</li>
</ul>
<h4>Условия хранения и доставки:</h4>
<ul>
<li>Большинство анализов — при комнатной температуре, в течение 1–2 часов</li>
<li>Некоторые на лёд (газы крови, лактат)</li>
<li>Транспортировать вертикально в специальном контейнере класса Б</li>
</ul>`},
{type:'skill', q:'Подготовка больного к рентгену, УЗИ и эндоскопии',
a:`<h4>Рентгенография лёгких:</h4>
<p>Специальная подготовка не нужна. Снять металлические предметы.</p>
<h4>Рентген ЖКТ с барием:</h4>
<ul><li>3 дня — диета без газообразующих продуктов</li>
<li>Вечером — очистительная клизма</li>
<li>Натощак в день исследования</li></ul>
<h4>УЗИ органов брюшной полости:</h4>
<ul>
<li>3 дня — исключить газообразующие продукты (бобовые, молоко, чёрный хлеб)</li>
<li>Натощак, исследование утром</li>
<li>Принять эспумизан накануне</li>
</ul>
<h4>ФГДС (гастроскопия):</h4>
<ul>
<li>Натощак 8–12 часов</li>
<li>Не пить, не курить за 2 часа</li>
<li>Снять зубные протезы</li>
<li>Анестезия горла лидокаином перед исследованием</li>
</ul>
<h4>Колоноскопия:</h4>
<ul><li>3 дня — бесшлаковая диета</li>
<li>Накануне — Фортранс/Мовипреп (4 л за 2–4 часа)</li>
<li>Утром в день — очистительная клизма по назначению</li></ul>`}
]},

{n:21, tags:['skill','org'],
qs:[
{type:'theory', q:'Способы применения лекарств',
a:`<h4>Энтеральные (через ЖКТ):</h4>
<ul>
<li><strong>Пероральный</strong> (внутрь) — таблетки, капсулы, сиропы</li>
<li><strong>Сублингвальный</strong> (под язык) — нитроглицерин, клофелин</li>
<li><strong>Ректальный</strong> — суппозитории, микроклизмы</li>
</ul>
<h4>Парентеральные (минуя ЖКТ):</h4>
<ul>
<li>Подкожные, внутримышечные, внутривенные инъекции</li>
<li>Внутрикостные, внутриартериальные (специальные случаи)</li>
</ul>
<h4>Местные:</h4>
<ul>
<li>Накожные (мази, пластыри)</li>
<li>Ингаляционные (аэрозоли, небулайзер)</li>
<li>В слизистые (глаза, уши, нос)</li>
<li>Трансдермальные (пластыри с нитратами, фентанилом)</li>
</ul>
<h4>Скорость наступления эффекта:</h4>
<p>в/в &gt; ингаляции &gt; п/к &gt; в/м &gt; пероральный &gt; ректальный</p>`},
{type:'skill', q:'Разъяснение больным защитного режима лечения',
a:`<h4>Защитный режим включает:</h4>
<ul>
<li>Соблюдение <strong>постельного/палатного/общего</strong> режима согласно назначению</li>
<li>Правильный приём лекарств (время, дозировка, совместимость с едой)</li>
<li>Диетическое питание (соответствующий стол)</li>
<li>Ограничение физических и эмоциональных нагрузок</li>
<li>Измерение АД, сахара крови при необходимости</li>
</ul>
<h4>Техника обучения пациента:</h4>
<ul>
<li>Говорить простым языком, без терминов</li>
<li>Использовать наглядные пособия</li>
<li>Проверить понимание («Расскажите, как Вы будете принимать лекарство»)</li>
<li>Дать письменную памятку</li>
<li>Привлечь родственников</li>
</ul>`},
{type:'skill', q:'Обработка рук антисептиком (повтор, см. Билет 3)',
a:`<p>Алгоритм гигиенической обработки рук — 6 стандартных движений EN 1500 (см. Билет 3, вопрос 2).</p>
<div class="tip">Запомните: обработка рук — самая важная и доступная мера профилактики внутрибольничных инфекций. Выполняется минимум 5 моментов (по ВОЗ): до контакта, до асептической процедуры, после риска контакта с биологическими жидкостями, после контакта с пациентом, после контакта с окружением</div>`}
]},

{n:22, tags:['org','skill'],
qs:[
{type:'theory', q:'Основные показания и противопоказания к применению лекарств',
a:`<h4>Показания к применению — это заболевания/состояния, при которых препарат эффективен:</h4>
<ul>
<li>Устанавливаются производителем на основании клинических испытаний</li>
<li>Абсолютные — единственный вариант лечения</li>
<li>Относительные — один из возможных вариантов</li>
</ul>
<h4>Противопоказания — условия, при которых препарат нельзя применять:</h4>
<ul>
<li><strong>Абсолютные (безусловные):</strong> беременность, тяжёлая аллергия на препарат</li>
<li><strong>Относительные:</strong> почечная/печёночная недостаточность (дозу уменьшают)</li>
<li>Детский возраст, период лактации</li>
<li>Сопутствующие заболевания</li>
</ul>
<h4>Обязанности медсестры перед введением:</h4>
<ul>
<li>Знать показания и противопоказания назначенного препарата</li>
<li>Собрать аллергоанамнез</li>
<li>При сомнениях — уточнить у врача</li>
<li>Провести кожную аллергологическую пробу (при необходимости)</li>
</ul>`},
{type:'skill', q:'Контроль за санитарным состоянием палат, осуществление гигиенического ухода',
a:`<h4>Санитарное состояние палаты:</h4>
<ul>
<li>Текущая уборка 2 раза/день (протирание поверхностей дезраствором)</li>
<li>Проветривание 4–6 раз/день по 15–30 мин</li>
<li>Кварцевание 2 раза/день</li>
<li>Осмотр тумбочек (не более 3-дневного запаса скоропортящихся продуктов)</li>
<li>Смена постельного белья 1 раз в 7 дней и при загрязнении</li>
</ul>
<h4>Гигиенический уход за пациентом:</h4>
<ul>
<li>Умывание, чистка зубов утром</li>
<li>Обтирание влажной тканью (тяжёлые больные)</li>
<li>Подмывание пациентов с недержанием</li>
<li>Уход за полостью рта (риск вентилятор-ассоциированной пневмонии)</li>
<li>Уход за ногтями, волосами</li>
</ul>`},
{type:'skill', q:'Использование медицинской одежды и СИЗ (повтор)',
a:`<p>Алгоритм надевания стерильных перчаток — см. Билет 2, вопрос 3.</p>
<h4>Последовательность надевания СИЗ:</h4>
<ol style="margin-left:1rem;font-size:14px;line-height:1.8;color:var(--text2)">
<li>Халат/костюм</li>
<li>Шапочка</li>
<li>Маска/респиратор</li>
<li>Очки/щиток</li>
<li>Перчатки</li>
</ol>
<h4>Снятие в обратном порядке:</h4>
<ol style="margin-left:1rem;font-size:14px;line-height:1.8;color:var(--text2)">
<li>Перчатки (выворачивая)</li>
<li>Очки</li>
<li>Халат (выворачивая)</li>
<li>Маска</li>
<li>Шапочка</li>
<li>Обработка рук</li>
</ol>`}
]},

{n:23, tags:['org','skill'],
qs:[
{type:'theory', q:'Основные обязанности медсестры отделения интенсивной терапии',
a:`<h4>ОРИТ (отделение реанимации и интенсивной терапии):</h4>
<h4>Обязанности:</h4>
<ul>
<li>Непрерывный мониторинг: ЭКГ, АД (инвазивно и неинвазивно), SpO₂, ЦВД, ЧДД, диурез</li>
<li>Введение препаратов через инфузоматы и шприцы-дозаторы</li>
<li>Уход за интубированными пациентами (ИВЛ): санация трахеобронхиального дерева, уход за ротовой полостью</li>
<li>Уход за центральными катетерами, уход за мочевым катетером</li>
<li>Профилактика пролежней (смена положения каждые 2 ч)</li>
<li>Введение зондового питания</li>
<li>Ведение документации (карта интенсивного наблюдения)</li>
<li>Участие в реанимации</li>
<li>Психологическая поддержка пациентов в сознании</li>
</ul>`},
{type:'skill', q:'Контроль учёта и использования лекарственных средств',
a:`<h4>Группы препаратов по учёту:</h4>
<ul>
<li><strong>Наркотические (список I):</strong> хранятся в сейфе, строгий журнал учёта, отчёт в наркологию, уничтожение под комиссией</li>
<li><strong>Психотропные (список II, III):</strong> аналогичный строгий учёт</li>
<li><strong>Сильнодействующие:</strong> отдельный шкаф под замком</li>
<li><strong>Ядовитые</strong></li>
</ul>
<h4>Требования к хранению:</h4>
<ul>
<li>Название, дозировка, срок годности на этикетке</li>
<li>Раздельное хранение по группам (для внутреннего и наружного применения)</li>
<li>Светочувствительные — в тёмном флаконе</li>
<li>Термолабильные — в холодильнике (2–8°C)</li>
</ul>`},
{type:'skill', q:'Кормление через зонд и гастростому (повтор, см. Билет 2)',
a:`<p>Подробный алгоритм — в Билете 2, вопрос 2.</p>
<h4>Дополнительно — частота кормления:</h4>
<ul>
<li>Болюсное: 5–6 раз в сутки по 200–300 мл</li>
<li>Непрерывное (капельно): 40–60 мл/час через инфузомат</li>
</ul>
<h4>Контроль:</h4>
<ul>
<li>Проверять положение зонда перед каждым кормлением</li>
<li>Остаточный объём в желудке не должен превышать 150–200 мл (подтянуть поршнем)</li>
</ul>`}
]},

{n:24, tags:['org','skill'],
qs:[
{type:'theory', q:'Основные обязанности медсестры отделения анестезиологии и реаниматологии',
a:`<h4>Специфика работы анестезиологической медсестры:</h4>
<ul>
<li>Подготовка наркозного оборудования (аппарат ИВЛ, ларингоскоп, эндотрахеальные трубки)</li>
<li>Подготовка медикаментов для анестезии (пропофол, кетамин, фентанил, релаксанты)</li>
<li>Участие в индукции анестезии и интубации</li>
<li>Мониторинг пациента во время операции (ЭКГ, SpO₂, АД, ЧДД, капнография)</li>
<li>Ведение анестезиологической карты</li>
<li>Наблюдение за пациентом в посленаркозной палате</li>
<li>Уход за реанимационными пациентами (ИВЛ, инфузии, зондовое питание)</li>
<li>Участие в проведении реанимационных мероприятий</li>
<li>Строгий учёт наркотических препаратов</li>
</ul>`},
{type:'skill', q:'Заполнение титульного листа стационарной медицинской карты',
a:`<h4>Форма 003/у — «Медицинская карта стационарного больного»:</h4>
<h4>Данные, вносимые медсестрой при поступлении:</h4>
<ul>
<li>ФИО пациента полностью</li>
<li>Дата и время поступления</li>
<li>Вид поступления (плановое/экстренное)</li>
<li>Отделение, палата, № кровати</li>
<li>Возраст, дата рождения</li>
<li>Пол</li>
<li>Место работы, должность</li>
<li>Адрес, телефон</li>
<li>Диагноз направившего учреждения</li>
<li>Аллергологический анамнез (подчеркнуть «непереносимость»)</li>
<li>Группа крови, Rh-фактор</li>
</ul>
<div class="warning">Данные о группе крови/Rh проверять у пациента устно и подтверждать документально!</div>`},
{type:'skill', q:'Профилактика и уход за пролежнями (повтор, см. Билет 1)',
a:`<p>Подробный алгоритм — Билет 1, вопрос 3.</p>
<h4>Шкала Брейден (оценка риска пролежней):</h4>
<ul>
<li>Оценивает: сенсорное восприятие, влажность, активность, подвижность, питание, трение/сдвиг</li>
<li>≤18 баллов — высокий риск, требуется профилактика</li>
</ul>
<h4>Средства профилактики:</h4>
<ul>
<li>Противопролежневые матрасы (чередующееся давление)</li>
<li>Специализированные повязки (гидроколлоидные) на зоны риска</li>
<li>Питание: белок ≥1,2 г/кг/сут, витамин C, цинк</li>
</ul>`}
]},

{n:25, tags:['emergency','skill'],
qs:[
{type:'theory', q:'Асфиксия (повтор, см. Билет 10)',
a:`<p>Подробное описание — Билет 10, вопрос 1.</p>
<h4>Приём Геймлиха (при инородном теле):</h4>
<div class="algo"><div class="algo-title">У взрослого в сознании</div><ol>
<li>Встать сзади пациента</li>
<li>Обхватить его руками на уровне эпигастрия</li>
<li>Одна рука кулаком, другая сверху</li>
<li>5 резких толчков внутрь и вверх</li>
<li>Чередовать с 5 ударами по спине</li>
</ol></div>
<h4>У лежачего/без сознания:</h4>
<ul>
<li>Повернуть на бок, 5 ударов по спине ладонью</li>
<li>Проверить рот, убрать видимое инородное тело</li>
<li>ИВЛ, СЛР при необходимости</li>
</ul>`},
{type:'skill', q:'Заполнение титульного листа (повтор, см. Билет 24)',
a:`<p>Алгоритм аналогичен Билету 24, вопрос 2.</p>`},
