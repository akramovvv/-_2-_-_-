]},

{n:26, tags:['emergency','skill','case'],
qs:[
{type:'theory', q:'Асфиксия (повтор)',
a:`<p>Алгоритм — Билет 10, вопрос 1.</p>`},
{type:'skill', q:'Как правильно выполнить внутримышечную инъекцию и выбрать место введения',
a:`<p>Подробный алгоритм — Билет 12, вопрос 2.</p>
<h4>Выбор места для ВМ инъекции:</h4>
<ul>
<li><strong>Ягодица (верхненаружный квадрант)</strong> — мысленно разделить ягодицу на 4 части. Инъекция — только в верхненаружный квадрант. Избегать седалищного нерва!</li>
<li><strong>Бедро</strong> (передненаружная поверхность) — удобно для самостоятельного введения</li>
<li><strong>Дельтовидная мышца</strong> — небольшие объёмы (до 2 мл), вакцины</li>
</ul>`},
{type:'case', q:'Клиническая задача: Пациент после операции — сильная боль в области шва',
a:`<h4>1. Оценка боли:</h4>
<ul>
<li>Использовать ЦАШ (цифровая аналоговая шкала): от 0 до 10, где 0 — нет боли, 10 — невыносимая</li>
<li>Или визуально-аналоговую шкалу (линейка)</li>
<li>Описание: характер (острая/тупая), локализация, иррадиация, факторы усиления</li>
</ul>
<h4>2. Действия медсестры:</h4>
<ul>
<li>Уложить пациента в удобное положение</li>
<li>Обследовать шов (покраснение, отёчность, расхождение)</li>
<li>Немедленно сообщить врачу о характере боли</li>
<li>Выполнить назначенные аналгетики (по листу назначений)</li>
<li>Обеспечить покой</li>
</ul>
<h4>3. Осложнения ограничения подвижности:</h4>
<ul>
<li>Тромбоэмболия лёгочной артерии (ТЭЛА)</li>
<li>Гипостатическая пневмония</li>
<li>Пролежни</li>
<li>Атония кишечника, запор</li>
<li>Мышечная атрофия</li>
<li>Задержка мочи</li>
</ul>`}
]},

{n:27, tags:['emergency','skill','case'],
qs:[
{type:'theory', q:'Обязанности медсестры отделения анестезиологии и реаниматологии (повтор, см. Билет 24)',
a:`<p>Подробное описание — Билет 24, вопрос 1.</p>`},
{type:'skill', q:'Действия медсестры при развитии анафилактического шока',
a:`<p>Подробный алгоритм — Билет 8, вопрос 1.</p>
<h4>Набор для анафилаксии (должен быть в каждом отделении):</h4>
<ul>
<li>Адреналин 0,1% — ампулы</li>
<li>Преднизолон/дексаметазон</li>
<li>Антигистаминные (супрастин, димедрол)</li>
<li>Эуфиллин (при бронхоспазме)</li>
<li>Система для инфузии, физраствор</li>
<li>Кислородная маска, мешок Амбу</li>
</ul>`},
{type:'case', q:'Клиническая задача: Пациент с высокой температурой 39°C',
a:`<h4>1. Измерение температуры:</h4>
<ul>
<li>Термометр стряхнуть до 35°C, поместить в сухую подмышечную впадину на 10 мин</li>
<li>Можно ректально (на 0,5°C выше нормы), в ухо (инфракрасным)</li>
<li>Зафиксировать в документах</li>
</ul>
<h4>2. Неотложные меры:</h4>
<ul>
<li>Постельный режим, обильное тёплое питьё</li>
<li>Физическое охлаждение: влажное обтирание, холодный компресс на лоб, пахи, подмышки</li>
<li>Жаропонижающие по назначению врача (парацетамол, ибупрофен)</li>
<li>Мониторинг ЧСС, АД, диуреза</li>
<li>Устранение причины (по назначению врача)</li>
</ul>
<h4>3. Когда сообщить врачу:</h4>
<ul>
<li>t° >38,5°C у взрослых (>38°C у детей до 3 лет и пожилых)</li>
<li>Сопровождается судорогами, потерей сознания</li>
<li>Нет эффекта от жаропонижающих через 30–40 мин</li>
<li>Ухудшение общего состояния</li>
</ul>`}
]},

{n:28, tags:['emergency','skill','case'],
qs:[
{type:'theory', q:'Обязанности медсестры отделения интенсивной терапии (повтор, см. Билет 23)',
a:`<p>Подробное описание — Билет 23, вопрос 1.</p>`},
{type:'skill', q:'Как правильно измерить АД механическим тонометром',
a:`<p>Подробный алгоритм — Билет 1, вопрос 2.</p>
<h4>Распространённые ошибки:</h4>
<ul>
<li>Манжета слишком узкая — завышение результата</li>
<li>Манжета наложена неплотно/неправильно</li>
<li>Рука выше уровня сердца — занижение</li>
<li>Измерение сразу после физической нагрузки</li>
<li>Не снят жгут перед измерением</li>
</ul>`},
{type:'case', q:'Клиническая задача: Пациент с гипертонией жалуется на головную боль',
a:`<h4>1. Измерение АД:</h4>
<ul>
<li>На обеих руках (разница более 10 мм рт. ст. — повод для обследования)</li>
<li>В покое, сидя, 2–3 измерения с интервалом 3 мин</li>
<li>Зафиксировать результат</li>
</ul>
<h4>2. Действия медсестры:</h4>
<ul>
<li>Немедленно вызвать врача при АД >180/110</li>
<li>Уложить с приподнятым головным концом</li>
<li>Обеспечить покой и тишину</li>
<li>Дать назначенный гипотензивный препарат (каптоприл)</li>
<li>Контроль АД каждые 15 мин</li>
</ul>
<h4>3. Признаки гипертонического криза:</h4>
<ul>
<li>АД >180/110 мм рт. ст.</li>
<li>Резкая головная боль, тошнота/рвота</li>
<li>Мелькание мушек, нарушение зрения</li>
<li>Возбуждение или заторможенность</li>
<li>Боль в груди, одышка (осложнённый криз)</li>
</ul>`}
]},

{n:29, tags:['skill','case'],
qs:[
{type:'theory', q:'Показания и противопоказания к применению лекарств. Алгоритм постановки периферического венозного катетера',
a:`<p>Показания и противопоказания — Билет 22, вопрос 1.</p>
<h4>Алгоритм постановки ПВК (периферического венозного катетера):</h4>
<div class="algo"><div class="algo-title">Алгоритм</div><ol>
<li>Выбрать место (локтевые вены, вены предплечья), избегать суставов</li>
<li>Наложить жгут, выбрать вену</li>
<li>Обработать кожу антисептиком, дать высохнуть</li>
<li>Выбрать катетер: 14G (красный) — массивная инфузия, 16G (серый), 18G (зелёный), 20G (розовый), 22G (синий) — малые инфузии</li>
<li>Ввести катетер в вену под углом 15° срезом вверх</li>
<li>При появлении крови в индикаторной камере — продвинуть на 2 мм, извлечь иглу-проводник</li>
<li>Снять жгут, присоединить заглушку или систему</li>
<li>Зафиксировать пластырем/катетерным фиксатором</li>
<li>Записать дату установки</li>
</ol></div>
<div class="warning">ПВК менять каждые 72–96 часа! При признаках флебита — сразу удалить</div>`},
{type:'case', q:'Клиническая задача: Пролежень у лежачего пациента в области крестца',
a:`<h4>1. Определение стадии пролежня:</h4>
<ul>
<li><strong>Стадия I:</strong> покраснение кожи, не исчезающее при надавливании, кожа целая</li>
<li><strong>Стадия II:</strong> поверхностный дефект кожи (эпидермис/дерма), пузырь</li>
<li><strong>Стадия III:</strong> глубокий дефект — некроз до фасции</li>
<li><strong>Стадия IV:</strong> глубокий некроз с поражением мышц, кости</li>
</ul>
<h4>2. Профилактические меры:</h4>
<ul>
<li>Смена положения каждые 2 часа</li>
<li>Противопролежневый матрас</li>
<li>Полноценное питание (белок, витамин C, цинк)</li>
<li>Гигиена и сухость кожи</li>
</ul>
<h4>3. Уход за кожей:</h4>
<ul>
<li>Мягкое очищение тёплой водой, pH-нейтральным средством</li>
<li>Увлажняющий крем, не массировать красные участки</li>
<li>Защитные барьерные кремы (при недержании)</li>
<li>Гидроколлоидные повязки на зоны риска</li>
</ul>`}
]},

{n:30, tags:['org','skill','case'],
qs:[
{type:'theory', q:'Основные задачи палатной медсестры терапевтического отделения (повтор, см. Билет 20)',
a:`<p>Подробное описание — Билет 20, вопрос 1.</p>`},
{type:'skill', q:'Как обработать руки перед инвазивной процедурой',
a:`<p>Алгоритм гигиенической и хирургической обработки рук — Билет 3, вопрос 2.</p>
<h4>Перед инвазивной процедурой (уровень — гигиенический):</h4>
<ol style="margin-left:1rem;font-size:14px;line-height:1.8;color:var(--text2)">
<li>Снять кольца, браслеты</li>
<li>Нанести 3 мл антисептика на сухие руки</li>
<li>Выполнить 6 стандартных движений EN 1500</li>
<li>Растирать 30 секунд до полного высыхания</li>
<li>Надеть стерильные перчатки</li>
</ol>`},
{type:'case', q:'Клиническая задача: Пациент отказывается принимать лекарства',
a:`<h4>1. Выяснение причины отказа:</h4>
<ul>
<li>Побочные эффекты (тошнота, головокружение)</li>
<li>Непонимание необходимости лечения</li>
<li>Страх, недоверие к врачу</li>
<li>Финансовые трудности (дорогой препарат)</li>
<li>Религиозные/культурные убеждения</li>
</ul>
<h4>2. Как объяснить необходимость:</h4>
<ul>
<li>Простым языком объяснить, зачем нужен препарат</li>
<li>Рассказать о последствиях отказа от лечения</li>
<li>Предложить альтернативные формы (если таблетки — может, есть жидкость?)</li>
<li>Привлечь лечащего врача для разъяснения</li>
<li>Документировать факт отказа (пациент подписывает)</li>
</ul>
<h4>3. Когда сообщить врачу:</h4>
<ul>
<li>Немедленно — при критически важных препаратах (антибиотики при сепсисе, инсулин при СД1)</li>
<li>При ухудшении состояния</li>
<li>Если пациент отказывается от нескольких назначений</li>
</ul>
<div class="warning">Принудительное введение лекарств без согласия — нарушение прав пациента (кроме экстренных случаев!)</div>`}
]},

{n:31, tags:['org','skill','case'],
qs:[
{type:'theory', q:'Медицинские документы, заполняемые медсёстрами (повтор, см. Билет 19)',
a:`<p>Подробное описание — Билет 19, вопрос 1.</p>`},
{type:'skill', q:'Меры профилактики пролежней у лежачего пациента',
a:`<p>Подробный алгоритм — Билет 1, вопрос 3.</p>
<h4>Положения для смены:</h4>
<ul>
<li>На спине → на правом боку → на спине → на левом боку (каждые 2 часа)</li>
<li>Положение Фаулера (30°) — снижает риск для крестца</li>
<li>Подушки под костные выступы</li>
</ul>`},
{type:'case', q:'Клиническая задача: После инъекции — уплотнение и боль',
a:`<h4>1. Возможные причины:</h4>
<ul>
<li><strong>Инфильтрат</strong> — введение раздражающего препарата, быстрое введение, нарушение асептики</li>
<li><strong>Абсцесс</strong> — инфицирование (нагноение инфильтрата)</li>
<li><strong>Гематома</strong> — повреждение сосуда</li>
<li><strong>Некроз</strong> — при экстравазации кальция, хлорида кальция</li>
</ul>
<h4>2. Действия медсестры:</h4>
<ul>
<li>Немедленно сообщить врачу</li>
<li>Инфильтрат: тёплый влажный компресс, гепариновая мазь, сетка из йода</li>
<li>При нагноении — вскрытие и дренирование (хирург)</li>
<li>Задокументировать осложнение</li>
</ul>
<h4>3. Профилактика:</h4>
<ul>
<li>Чередовать места инъекций</li>
<li>Вводить медленно</li>
<li>Правильная техника асептики</li>
<li>Использовать острые иглы (не тупые!)</li>
<li>Подогреть масляные растворы до 37–38°C</li>
</ul>`}
]},

{n:32, tags:['org','skill','case'],
qs:[
{type:'theory', q:'Организация работы постовой медсестры (повтор, см. Билет 18)',
a:`<p>Подробное описание — Билет 18, вопрос 1.</p>`},
{type:'skill', q:'Как правильно собрать мочу на общий анализ',
a:`<p>Алгоритм — Билет 19, вопрос 3.</p>
<h4>Нормальные показатели ОАМ:</h4>
<ul>
<li>Цвет: соломенно-жёлтый</li>
<li>Прозрачность: прозрачная</li>
<li>Уд. вес: 1010–1025</li>
<li>pH: 4,5–8,0</li>
<li>Белок: следы или отрицательно</li>
<li>Глюкоза: отрицательно</li>
<li>Лейкоциты: 0–5 в п/з (жен.), 0–3 (муж.)</li>
<li>Эритроциты: единичные или 0</li>
</ul>`},
{type:'case', q:'Клиническая задача: Пациент жалуется на одышку в покое',
a:`<h4>1. Оценка степени одышки (шкала mMRC):</h4>
<ul>
<li>0 — только при интенсивной нагрузке</li>
<li>1 — при быстрой ходьбе, подъёме на горку</li>
<li>2 — медленнее сверстников, приходится останавливаться</li>
<li>3 — останавливается через 100 м или через несколько мин</li>
<li>4 — одышка <strong>в покое</strong> (критическое состояние!)</li>
</ul>
<h4>2. Первичные меры:</h4>
<ul>
<li>Немедленно вызвать врача</li>
<li>Оксигенотерапия: начать через маску или канюли</li>
<li>Установить в/в доступ</li>
<li>Измерить SpO₂, ЧДД, ЧСС, АД</li>
<li>ЭКГ</li>
</ul>

// STATE
let openTickets = new Set();
let expandAll = false;
let activeFilter = 'all';

const FILTER_MAP = {
  'emergency': ['emergency'],
  'injection': ['injection','skill'],
  'hygiene': ['hygiene'],
  'org': ['org']
};

const TYPE_LABELS = {'theory':'Теория','skill':'Навык/Алгоритм','case':'Клиническая задача'};
const TYPE_CLASSES = {'theory':'t-theory','skill':'t-skill','case':'t-case'};
const COLORS = ['c-blue','c-green','c-orange','c-purple','c-red','c-teal','c-brown',
  'c-blue','c-green','c-orange','c-purple','c-red','c-teal','c-brown',
  'c-blue','c-green','c-orange','c-purple','c-red','c-teal','c-brown',
  'c-blue','c-green','c-orange','c-purple','c-red','c-teal','c-brown',
  'c-blue','c-green','c-orange','c-purple','c-red'];

function renderTickets(filter) {
  const container = document.getElementById('tickets-container');
  const search = document.getElementById('search-input').value.toLowerCase();
  container.innerHTML = '';
  let count = 0;
  
  TICKETS.forEach((ticket, idx) => {
    const matchSearch = !search || ticket.qs.some(q => 
      q.q.toLowerCase().includes(search) || q.a.toLowerCase().includes(search)) ||
      ('билет ' + ticket.n).includes(search);
    
    const matchFilter = filter === 'all' || ticket.tags.some(t => 
      (FILTER_MAP[filter]||[filter]).includes(t));
    
    if (!matchSearch || !matchFilter) return;
    count++;
    
    const isOpen = openTickets.has(ticket.n);
    const div = document.createElement('div');
    div.className = 'ticket';
    div.id = 'ticket-' + ticket.n;
    
    div.innerHTML = `
      <div class="ticket-header" onclick="toggleTicket(${ticket.n})">
        <div class="ticket-num ${COLORS[idx]}">Б${ticket.n}</div>
        <div class="ticket-title">Билет ${ticket.n}</div>
        <div class="ticket-arrow ${isOpen ? 'open' : ''}">›</div>
      </div>
      <div class="ticket-body ${isOpen ? 'open' : ''}">
        ${ticket.qs.map((q, qi) => `
          <div class="qblock">
            <div class="q-label">
              <div class="q-num ${COLORS[idx]}">${qi+1}</div>
              <span class="q-type ${TYPE_CLASSES[q.type]}">${TYPE_LABELS[q.type]}</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div class="answer">${q.a}</div>
          </div>
        `).join('')}
      </div>`;
    container.appendChild(div);
  });
  
  document.getElementById('results-count').textContent = count + ' билет' + (count===1?'':count<5?'а':'ов');
  document.getElementById('no-results').style.display = count === 0 ? 'block' : 'none';
  updateProgress();
}

function toggleTicket(n) {
  if (openTickets.has(n)) openTickets.delete(n);
  else openTickets.add(n);
  
  const body = document.querySelector('#ticket-' + n + ' .ticket-body');
  const arrow = document.querySelector('#ticket-' + n + ' .ticket-arrow');
  if (body) {
    body.classList.toggle('open', openTickets.has(n));
    arrow.classList.toggle('open', openTickets.has(n));
  }
  updateProgress();
}

function toggleAll() {
  expandAll = !expandAll;
  document.getElementById('expand-btn').textContent = expandAll ? 'Свернуть все' : 'Развернуть все';
  if (expandAll) TICKETS.forEach(t => openTickets.add(t.n));
  else openTickets.clear();
  renderTickets(activeFilter);
}

function filterByType(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTickets(type);
}

function filterTickets() {
  renderTickets(activeFilter);
}

function updateProgress() {
  const opened = openTickets.size;
  const total = TICKETS.length;
  const pct = Math.round(opened / total * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `Открыто ${opened} из ${total} билетов (${pct}%)`;
}

// Restore from localStorage
try {
  const saved = localStorage.getItem('nursing_opened');
  if (saved) JSON.parse(saved).forEach(n => openTickets.add(n));
} catch(e){}

renderTickets('all');
</script>
